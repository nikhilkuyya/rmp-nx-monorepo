<div>
  <h1>Prompt Agent</h1>
  <form (submit)="onSubmit($event)">
    <p class="min-h-20 full-width border border-gray-300 rounded-md p-2 bg-yellow-100">
      {{promptResponse()}}
    </p>
    <textarea
      [formField]="promptForm.prompt"
      rows="4"
      class="block w-full border border-gray-300 rounded-md p-2 bg-gray-10"
    ></textarea>
    <button type="submit" rmpButton variant="primary" size="medium">Submit</button>
  </form>
</div>
